<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günün Afişası – Poster Oluşturucu</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--lime:#A5F000;--bg:#f2f4f2;--fg:#111;--card:#fff;--line:#8884;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101412;--fg:#eee;--card:#1a201d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px Arial,sans-serif}
#wrap{margin:8px auto;overflow:hidden}
#poster{width:1080px;height:1440px;transform-origin:0 0;position:relative;overflow:hidden;font-family:Oswald,"Arial Narrow",Impact,sans-serif;text-transform:uppercase;color:#fff;background:radial-gradient(ellipse at 12% 95%,#0f6a30aa,transparent 50%),radial-gradient(ellipse at 55% 45%,#020504 35%,#041A11 100%)}
.geo{position:absolute;left:0;top:0}
.lights{position:absolute;left:0;top:610px}.stands{position:absolute;left:0;top:760px;width:255px;height:520px;background:repeating-linear-gradient(172deg,transparent 0 22px,#A5F00033 22px 26px,transparent 26px 44px);opacity:.8}.cbg .geo,.cbg .lights,.cbg .dots,.cbg .ball,.cbg .stands{display:none}.fi{display:flex;align-items:center;gap:12px}
.dots{position:absolute;left:0;right:0;bottom:0;height:420px;background:radial-gradient(circle,#A5F00044 1.5px,transparent 2px) 0 0/10px 10px;opacity:.7}
.ball{position:absolute;left:24px;bottom:96px;width:200px;height:200px;border-radius:50%;box-shadow:0 0 40px 10px var(--lime),0 0 110px 34px #A5F00066}.ball svg{display:block;width:100%;height:100%}
#side{position:absolute;left:14px;top:290px;width:250px;font-style:italic;font-weight:700;line-height:.95;white-space:nowrap}
#side>div{width:max-content}
#side .d{font-size:66px;margin-bottom:6px;transform:skewX(-9deg) scaleX(.82);transform-origin:left bottom;text-shadow:0 0 12px #0008}
#side .t{font-size:104px;line-height:1.18;color:var(--lime);transform:skewX(-9deg) scaleX(.74);transform-origin:left bottom;letter-spacing:-1px;text-shadow:3px 3px 0 #2c6a00,0 0 22px #A5F000aa}
#content{position:absolute;left:255px;right:30px;top:60px;bottom:158px;display:flex;flex-direction:column;gap:22px}
.league{flex:none;display:flex;flex-direction:column;background:rgba(4,26,17,.93);border:2px solid #d5ddd8;border-radius:22px;overflow:hidden}
.lh{height:80px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid #ffffff66;font-size:48px;font-weight:700}
.lh .lg{width:58px;height:58px}
.row{height:var(--rh);flex:none;display:flex;min-height:0;border-top:1px solid #ffffff22}
.row:first-of-type{border-top:0}
.time{width:124px;flex:none;background:linear-gradient(180deg,#C4FF3A,#A5F000);color:#020504;font-size:46px;font-weight:700;display:flex;align-items:center;justify-content:center}
.match{flex:1;display:flex;align-items:center;justify-content:space-around;min-width:0}
.team{display:flex;flex-direction:column;align-items:center;justify-content:center;width:200px;font-size:var(--tf);font-weight:500;text-align:center;gap:4px;line-height:1}
.team .lg{width:var(--ls);height:var(--ls)}
.vs{font-size:50px;font-weight:700;font-style:italic;color:var(--lime);text-shadow:0 0 10px #A5F00099}
.tv{width:190px;flex:none;border-left:2px solid #ffffff55;margin:12px 0;display:flex;align-items:center;justify-content:center}
.tv .lg{width:160px;height:calc(var(--ls)*.75)}
.lg{display:flex;align-items:center;justify-content:center;overflow:hidden}
.lg img{width:100%;height:100%;object-fit:contain}
.lg.ph{border:2px dashed #A5F00088;border-radius:50%;color:var(--lime);font-weight:700;font-size:26px}
#foot{position:absolute;left:226px;bottom:56px;width:800px}#foot img{display:block;width:100%}#foot span{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500;text-transform:none;white-space:nowrap;overflow:hidden}
/* UI */
main{max-width:620px;margin:0 auto;padding:0 12px 40px}
section.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
h3{margin:0 0 8px;font-size:16px}
label{display:block;font-size:12px;opacity:.7;margin:8px 0 2px}
input,select{width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:11px 16px;border:0;border-radius:8px;background:var(--lime);color:#020504;font-weight:700;font-size:15px;margin-top:10px}
button.s{background:#8883;color:var(--fg);padding:6px 10px;margin:0}
.it{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.it img{width:30px;height:30px;object-fit:contain}.it span{flex:1}
small{opacity:.7}
#out img{width:100%;margin-top:10px;border-radius:8px}
</style>
</head>
<body>
<div id="wrap"><div id="poster">
<svg class="geo" width="270" height="270" viewBox="0 0 270 270"><g stroke="#A5F000" stroke-width="16" opacity=".6"><path d="M0 40L40 0"/><path d="M0 90L90 0"/><path d="M0 140L140 0"/><path d="M0 190L190 0"/></g></svg>
<div class="stands"></div><div class="dots"></div>
<svg class="lights" width="250" height="110" viewBox="0 0 250 110"><defs><radialGradient id="gl"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><pattern id="pd" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3.5" fill="#fff"/></pattern></defs><circle cx="55" cy="55" r="52" fill="url(#gl)"/><circle cx="170" cy="72" r="48" fill="url(#gl)"/><rect x="25" y="31" width="60" height="48" fill="url(#pd)" transform="rotate(-8 55 55)"/><rect x="140" y="48" width="60" height="48" fill="url(#pd)" transform="rotate(-8 170 72)"/></svg>
<div class="ball"><svg viewBox="-100 -100 200 200"><defs><radialGradient id="bb" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#d3d7d5"/><stop offset="1" stop-color="#4a4f4c"/></radialGradient><clipPath id="bc"><circle r="100"/></clipPath></defs><circle r="100" fill="url(#bb)"/><g clip-path="url(#bc)" fill="#0d110f" stroke="#0d110f" stroke-width="3" stroke-linejoin="round"><polygon points="0,-34 32,-10 20,28 -20,28 -32,-10"/><path d="M0 -34V-62M32 -10L60 -20M20 28L38 52M-20 28L-38 52M-32 -10L-60 -20" fill="none"/><g id="pt"><polygon points="-26,-108 26,-108 36,-76 0,-62 -36,-76" transform="rotate(36)"/></g><polygon points="-26,-108 26,-108 36,-76 0,-62 -36,-76" transform="rotate(108)"/><polygon points="-26,-108 26,-108 36,-76 0,-62 -36,-76" transform="rotate(180)"/><polygon points="-26,-108 26,-108 36,-76 0,-62 -36,-76" transform="rotate(252)"/><polygon points="-26,-108 26,-108 36,-76 0,-62 -36,-76" transform="rotate(324)"/></g></svg></div>
<div id="side"></div><div id="content"></div><div id="foot"></div>
</div></div>

<main>
<section class="p"><h3>⬇️ Posteri indir</h3>
 <button id="dl">PNG olarak indir</button>
 <div id="out"></div>
 <small>İndirme açılmazsa, görselin üstüne uzun basıp kaydedin.</small></section>

<section class="p"><h3>1) Loqolar</h3>
 <small id="fbstat">Firebase-ə qoşulur…</small><br><small>Klub və liqa loqoları Firebase-dən gəlir. Yalnız TV loqolarını (və olmayanları) aşağıdan əlavə edin.</small>
 <div class="g2"><div><label>Tür</label><select id="ltype"><option value="tv">Yayıncı (TV)</option><option value="league">Lig</option><option value="team">Takım</option></select></div>
 <div><label>Ad (ör. Arsenal)</label><input id="lname"></div></div>
 <label>Logo dosyası</label><input id="lfile" type="file" accept="image/*">
 <button id="ladd">Logoyu ekle</button>
 <div id="llist"></div></section>

<section class="p"><h3>2) Maç ekle</h3>
 <label>Lig</label><input id="mleague" list="dl_mleague" placeholder="Yazın və seçin" autocomplete="off">
 <div class="g2"><div><label>Saat</label><input id="mtime" placeholder="21:30" inputmode="numeric"></div>
 <div><label>Yayıncı</label><input id="mtv" list="dl_mtv" placeholder="Yazın və seçin" autocomplete="off"></div></div>
 <div class="g2"><div><label>Ev sahibi</label><input id="mhome" list="dl_mhome" placeholder="Yazın və seçin" autocomplete="off"></div>
 <div><label>Deplasman</label><input id="maway" list="dl_maway" placeholder="Yazın və seçin" autocomplete="off"></div></div>
 <datalist id="dl_mleague"></datalist><datalist id="dl_mhome"></datalist><datalist id="dl_maway"></datalist><datalist id="dl_mtv"></datalist>
 <button id="madd">Maçı ekle</button>
 <div id="mlist"></div></section>

<section class="p"><h3>3) Poster bilgileri</h3>
 <div class="g2"><div><label>Tarih</label><input id="idate"></div><div><label>Başlık 1</label><input id="it1"></div></div>
 <div class="g2"><div><label>Başlık 2</label><input id="it2"></div><div><label>Web sitesi</label><input id="iweb"></div></div>
 <label>WhatsApp / iletişim</label><input id="iwa">
 <label>Arka plan görseli (isteğe bağlı, 3:4 dikey)</label><input id="bgfile" type="file" accept="image/*">
 <button class="s" id="bgclear" style="margin-top:8px">Arka planı varsayılana döndür</button>
 <button class="s" id="clear" style="margin-top:14px">Tüm maçları temizle</button></section>
</main>

function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/png"))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}

const bgCache={};
function setBG(cut){
  const P=$("poster"),src=S.bg||BG0,key=src.length+":"+cut;
  const apply=u=>{P.style.background=`#020504 url("${u}") 0 0/1080px ${1440-cut}px no-repeat`};
  if(cut<=0){apply(src);return}
  if(bgCache[key]){apply(bgCache[key]);return}
  apply(src);
  const im=new Image();
  im.onload=()=>{
    const Hh=1440-cut,yc=840,F=80,kx=im.width/1080,ky=im.height/1440;
    const c=document.createElement("canvas");c.width=1080;c.height=Hh;const x=c.getContext("2d");
    x.drawImage(im,0,0,im.width,yc*ky,0,0,1080,yc);
    const sy=yc-F+cut,bh=1440-sy,b=document.createElement("canvas");b.width=1080;b.height=bh;const bx=b.getContext("2d");
    bx.drawImage(im,0,sy*ky,im.width,bh*ky,0,0,1080,bh);
    bx.globalCompositeOperation="destination-in";
    const g=bx.createLinearGradient(0,0,0,F);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,1)");
    bx.fillStyle=g;bx.fillRect(0,0,1080,bh);
    x.drawImage(b,0,yc-F);
    try{const u=c.toDataURL("image/jpeg",.9);bgCache[key]=u;apply(u)}catch(e){}
  };
  im.src=src;
}

function fbStat(){const e=[fbs.team,fbs.league].filter(x=>typeof x==="string");$("fbstat").textContent=e.length?"Firebase xətası: "+e.join(" | "):"Firebase: "+FB.filter(x=>x.type==="team").length+" klub, "+FB.filter(x=>x.type==="league").length+" liqa yükləndi"}
function fbLoad(db,coll,type,pre){db.collection(coll).onSnapshot(s=>{FB=FB.filter(x=>x.type!==type).concat(s.docs.map(d=>{const v=d.data();return{id:pre+d.id,type,name:v.name||"",data:v.logo||"",fb:1}}).filter(x=>x.data&&x.name));fbs[type]=1;fbStat();poster();ui()},e=>{fbs[type]=(e&&e.code)||"error";fbStat()})}
try{firebase.initializeApp(FBC);const db=firebase.firestore();fbLoad(db,"clubs","team","c:");fbLoad(db,"leagues","league","g:")}catch(e){$("fbstat").textContent="Firebase qoşulmadı: "+e.message}
addEventListener("resize",fit);all();fit();
</script>
